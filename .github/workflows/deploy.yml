name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production • Pterodactyl restart + E2E health
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deployment configuration
        env:
          PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          test -n "$PANEL_URL" || { echo "::error::PTERODACTYL_PANEL_URL is not configured"; exit 1; }
          test -n "$API_KEY" || { echo "::error::PTERODACTYL_API_KEY is not configured"; exit 1; }
          test -n "$SERVER_ID" || { echo "::error::PTERODACTYL_SERVER_ID is not configured"; exit 1; }
          test -n "$HEALTH_URL" || { echo "::error::PRODUCTION_HEALTHCHECK_URL is not configured"; exit 1; }

      - name: Restart production server
        env:
          PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          curl --fail-with-body --silent --show-error             --request POST             --url "${PANEL_URL%/}/api/client/servers/$SERVER_ID/power"             --header "Authorization: Bearer $API_KEY"             --header "Content-Type: application/json"             --data '{"signal":"restart"}'

      - name: Wait for production health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Health check attempt $attempt/30"
            if curl --fail --silent --show-error               --connect-timeout 5               --max-time 10               --retry 0               "$HEALTH_URL" >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production health check failed after 150 seconds"
          exit 1

      - name: Verify liveness endpoint
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          base="${HEALTH_URL%/}"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10             "$base/health/live" >/tmp/health-live.json
          cat /tmp/health-live.json

      - name: Verify readiness endpoint
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          base="${HEALTH_URL%/}"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10             "$base/health/ready" >/tmp/health-ready.json
          cat /tmp/health-ready.json

      - name: Deployment summary
        env:
          SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          echo "Production restart completed and health checks passed."
          echo "Pterodactyl server: $SERVER_ID"
