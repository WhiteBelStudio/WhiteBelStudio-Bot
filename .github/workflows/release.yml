name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BOT_TOKEN: "000000000:release-test-token"
      APP_ENV: "test"
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_release
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Ruff
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q app main.py start.py tests

      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.txt --strict

      - name: Migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Integration tests
        run: python -m pytest -q -m integration --strict-markers --disable-warnings --maxfail=1

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output="dist/whitebelstudio-bot-${{ steps.tag.outputs.value }}.tar.gz" "${{ steps.tag.outputs.value }}"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.value }}"             --generate-notes             --title "${{ steps.tag.outputs.value }}"             dist/*
