name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 • Ruff + Compile + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BOT_TOKEN: "000000000:ci-test-token"
      APP_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Compile check
        run: python -m compileall -q app main.py start.py tests

      - name: Unit and API tests
        run: python -m pytest -q -m "not integration" --disable-warnings --maxfail=1

      - name: Smoke import
        run: python -c "import main; print('imports: OK')"

  integration:
    name: PostgreSQL 16 • Migrations + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BOT_TOKEN: "000000000:ci-test-token"
      APP_ENV: "test"
      DATABASE_URL: "postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff integration files
        run: python -m ruff check tests/test_integration_db.py tests/test_integration_api.py

      - name: Compile integration tests
        run: python -m compileall -q app tests

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify migration state
        run: |
          python -m alembic current
          python -m alembic check

      - name: Database model integrity
        run: python -m pytest -q tests/test_database_models.py --disable-warnings --strict-markers

      - name: PostgreSQL integration tests
        run: python -m pytest -q -m integration --disable-warnings --strict-markers --maxfail=1
