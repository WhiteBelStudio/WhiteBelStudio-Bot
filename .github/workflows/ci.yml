name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BOT_TOKEN: "000000000:ci-test-token"
  APP_ENV: "test"
  DATABASE_URL: "postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_ci"

jobs:
  test:
    name: CI • Python 3.12 • PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit
          python -m pip check

      - name: Prepare artifacts
        run: mkdir -p artifacts

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app main.py start.py tests

      - name: Import smoke test
        run: python -c "import main; from app.api.app import app; print('import: OK', app.version)"

      - name: Apply Alembic migrations
        run: python -m alembic upgrade head

      - name: Verify Alembic state
        run: |
          python -m alembic current
          python -m alembic check

      - name: Database model tests
        run: python -m pytest -q tests/test_database_models.py --disable-warnings --strict-markers

      - name: Unit and API tests
        run: python -m pytest -q -m "not integration" --disable-warnings --maxfail=1 --strict-markers --junitxml=artifacts/unit-tests.xml

      - name: Integration tests
        run: python -m pytest -q -m integration --disable-warnings --maxfail=1 --strict-markers --junitxml=artifacts/integration-tests.xml

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

      - name: Build delivery artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --output="dist/whitebelstudio-bot-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          test -s dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload delivery artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whitebelstudio-bot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
