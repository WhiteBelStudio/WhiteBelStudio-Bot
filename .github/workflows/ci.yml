name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BOT_TOKEN: "000000000:ci-test-token"
  APP_ENV: "test"

jobs:
  quality:
    name: Quality • Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Compile check
        run: python -m compileall -q app main.py start.py tests

      - name: Unit and API tests
        run: python -m pytest -q -m "not integration" --disable-warnings --maxfail=1 --junitxml=artifacts/unit-tests.xml

      - name: Smoke import
        run: python -c "import main; from app.api.app import app; print(f'import: OK ({app.version})')"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: artifacts/unit-tests.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration • PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff integration tests
        run: python -m ruff check tests/test_integration_db.py tests/test_integration_api.py tests/test_callback_integration.py

      - name: Compile integration suite
        run: python -m compileall -q app tests

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify migration state
        run: |
          python -m alembic current
          python -m alembic check

      - name: Database model integrity
        run: python -m pytest -q tests/test_database_models.py --disable-warnings --strict-markers

      - name: PostgreSQL integration tests
        run: python -m pytest -q -m integration --disable-warnings --strict-markers --maxfail=1 --junitxml=artifacts/integration-tests.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report-${{ github.sha }}
          path: artifacts/integration-tests.xml
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security • dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.txt --strict

  source-artifact:
    name: Delivery artifact
    needs: [quality, integration, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output="dist/whitebelstudio-bot-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitebelstudio-bot-${{ github.sha }}
          path: dist/
          retention-days: 30
