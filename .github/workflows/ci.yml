name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BOT_TOKEN: "000000000:ci-test-token"
  APP_ENV: "test"

jobs:
  test:
    name: CI • Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit
          python -m pip check

      - name: Prepare artifacts
        run: mkdir -p artifacts

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app main.py start.py tests

      - name: Import smoke test
        run: python -c "import main; from app.api.app import app; print('import: OK', app.version)"

      - name: Unit and API tests
        run: python -m pytest -q -m "not integration" --disable-warnings --maxfail=1 --strict-markers --junitxml=artifacts/unit-tests.xml

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off

      - name: Build delivery artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --output="dist/whitebelstudio-bot-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          test -s dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload delivery artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whitebelstudio-bot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
