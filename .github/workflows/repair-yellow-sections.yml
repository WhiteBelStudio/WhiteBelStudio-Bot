name: Repair yellow sections

on:
  push:
    branches: [fix/yellow-sections-final]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair callback routing
        shell: python
        run: |
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          old = '''@dp.callback_query()\nasync def menu_callback_handler(callback: CallbackQuery) -> None:\n'''
          new = '''@dp.callback_query(F.data.in_({\n    "menu_profile",\n    "menu_reputation",\n    "menu_rules",\n    "shop",\n    "menu_help",\n    "help_categories",\n    "mini_games",\n    "mini_games:regular",\n    "mini_games:pvp",\n}))\nasync def menu_callback_handler(callback: CallbackQuery) -> None:\n'''
          if old not in text:
              raise SystemExit("expected callback handler signature not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Verify compile
        run: python -m compileall -q .

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: isolate global callback router from specialized sections"
          git push
