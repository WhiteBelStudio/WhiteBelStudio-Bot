name: Final validation

on:
  push:
    branches: [fix/yellow-sections-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Compile check
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Smoke import
        env:
          BOT_TOKEN: "000000000:ci-test-token"
        run: python -c "import main; print('imports: OK')"
