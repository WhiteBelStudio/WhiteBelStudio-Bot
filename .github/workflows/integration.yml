name: Integration

on:
  workflow_run:
    workflows: ["CI Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BOT_TOKEN: "000000000:ci-test-token"
  APP_ENV: "test"
  DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_ci

jobs:
  migration-consistency:
    name: Migration consistency • release gate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Resolve tested SHA
        id: sha
        run: echo "value=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Upgrade database from empty state
        run: python -m alembic upgrade head

      - name: Verify exactly one migration head
        run: |
          set -euo pipefail
          heads="$(python -m alembic heads | grep -c '(head)' || true)"
          test "$heads" -eq 1 || {
            echo "::error::Expected exactly one Alembic head, found $heads"
            python -m alembic heads
            exit 1
          }

      - name: Verify database is at migration head
        run: |
          set -euo pipefail
          python -m alembic current
          python -m alembic current | grep -q '(head)' || {
            echo "::error::Database is not at Alembic head after upgrade"
            exit 1
          }

      - name: Verify ORM metadata matches migrations
        run: |
          set -euo pipefail
          python -m alembic check

      - name: Verify migration history is linear
        run: |
          set -euo pipefail
          if python -m alembic heads | grep -q '^.* .* (head)$' && [ "$(python -m alembic heads | grep -c '(head)')" -ne 1 ]; then
            echo "::error::Migration history has multiple heads"
            exit 1
          fi
          python -m alembic history --verbose >/tmp/alembic-history.txt
          test -s /tmp/alembic-history.txt

      - name: Database model smoke
        run: python -m pytest -q tests/test_database_models.py --strict-markers --disable-warnings

      - name: Gate summary
        run: |
          echo "Migration consistency gate: PASS"
          echo "Tested SHA: ${{ steps.sha.outputs.value }}"
          python -m alembic current
          python -m alembic heads

  postgres:
    name: PostgreSQL • integration tests
    needs: migration-consistency
    if: ${{ needs.migration-consistency.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Resolve tested SHA
        id: sha
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Migration upgrade
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

      - name: Integration tests
        run: python -m pytest -q -m integration --strict-markers --disable-warnings --maxfail=1

      - name: Summary
        run: |
          echo "Integration gate passed for ${{ steps.sha.outputs.value }}"
