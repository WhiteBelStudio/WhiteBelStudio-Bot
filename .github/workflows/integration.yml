name: Integration

on:
  workflow_run:
    workflows: ["CI Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL • migrations + integration
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: whitebelstudio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d whitebelstudio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BOT_TOKEN: "000000000:ci-test-token"
      APP_ENV: "test"
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/whitebelstudio_ci
    steps:
      - name: Resolve tested SHA
        id: sha
        run: echo "value=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Migration upgrade
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

      - name: Integration tests
        run: python -m pytest -q -m integration --strict-markers --disable-warnings --maxfail=1

      - name: Database schema smoke
        run: python -m pytest -q tests/test_database_models.py --strict-markers --disable-warnings

      - name: Summary
        run: |
          echo "Integration gate passed for ${{ steps.sha.outputs.value }}"
